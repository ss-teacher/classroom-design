# 사이트 반영 — 노션을 읽어 사이트를 다시 만들고 인터넷에 올립니다.
#  · 매일 새벽 5시 17분(한국 시간)에 자동 실행
#  · '지금 반영': GitHub 저장소의 Actions 탭 → "사이트 반영" → Run workflow 버튼
#  · 코드를 고쳐 올렸을 때도 실행
# 노션 읽기나 만들기가 실패하면 올리기 단계로 넘어가지 않아, 기존 사이트가 그대로 남습니다.
name: 사이트 반영

on:
  schedule:
    - cron: '17 20 * * *' # 세계 표준시 20:17 = 한국 시간 다음 날 05:17
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# 반영이 겹치면 먼저 시작한 것이 끝난 뒤 다음 것을 실행합니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 노션 읽고 사이트 만들기
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    name: 인터넷에 올리기
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
